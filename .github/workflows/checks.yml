name: checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install (exact versions, transitive ones included)
        run: pip install -r requirements.txt -r requirements-dev.txt -c constraints.txt
      - name: Lint
        run: ruff check .
      - name: Types
        run: mypy
      - name: Tests (mock mode, no network, no keys)
        run: pytest -q
