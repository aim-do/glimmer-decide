[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 110
extend-exclude = ["promo"]

[tool.ruff.lint]
# Named explicitly, so a newer ruff with wider defaults cannot change what the gate checks.
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
files = ["server", "train", "eval", "deploy"]
